[package]
name = "papermono-host"
version = "0.1.0"
description = "Host API for PaperMono / PaperMono-Lite USB detect, snapshots, and CDC monitor"
readme = "README.md"
publish = true
edition.workspace = true
# espflash 4.7 requires Rust 1.95; board crates retain the workspace minimum.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Library used by cargo-espflash. The cargo plugin itself has no lib target.
# `cli` is intentionally off: no SemVer, and we must not pull ELF-flash helpers.
espflash = { version = "4.7.0", default-features = false, features = [
  "serialport",
] }
# Advisory flock for live USB commands (no unsafe in this crate).
fs4 = "1.1.0"
log = "0.4.35"
# USB CDC listen without opening the ACM TTY (cdc-acm can assert DTR).
nusb = "0.2.9"
# Ctrl-C must run Drop so we reattach cdc-acm (not a process-kill).
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Enumeration needs libudev; we only open ESPFLASH_PORT. Same as espflash.
serialport = { version = "4.10.1", default-features = false }
sha2 = "0.11.1"
papermono-log = { path = "../../crates/papermono-log" }
tempfile = "3.27.0"

[lints]
workspace = true
