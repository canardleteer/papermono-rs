[package]
name = "simple-debug-fw"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "PaperMono proof-of-life image (C153 default, or C153-Lite with --no-default-features --features lite). Flash only via cargo xtask flash-app after a matching snapshot exists."
license = "MIT"

# Workspace member, not a default-member: host `cargo test` skips this
# package. Build with `cargo xtask build-fw simple-debug` (C153 default, or
# `--no-default-features --features lite` for C153-Lite). Host-tested log
# lines live in crates/papermono-log.
# Do not inherit [lints] workspace = true (missing_docs / unsafe_code).

[features]
default = ["c153"]
c153 = ["dep:m5stack-papermono"]
# Compile-time pruned Lite-only profile
lite = []

[dependencies]
# Both firmware packages use the same published ESP release family.
esp-hal = { version = "1.2.2", features = [
  "esp32s3",
  "unstable",
] }
esp-println = { version = "0.18.0", default-features = false, features = [
  "esp32s3",
  "jtag-serial",
  "critical-section",
] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = [
  "esp32s3",
] }

m5stack-papermono-lite = { path = "../../crates/m5stack-papermono-lite" }
m5stack-papermono = { path = "../../crates/m5stack-papermono", optional = true }
papermono-log = { path = "../../crates/papermono-log" }

embedded-hal = "1.0.0"
