[package]
name = "embassy-debug-fw"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false
description = "PaperMono Embassy debug image (C153 default, or C153-Lite with --no-default-features --features lite). Flash only via cargo xtask flash-app after a matching snapshot exists."
license = "MIT"

# Workspace member, not a default-member: host `cargo test` skips this
# package. Build with `cargo xtask build-fw embassy-debug` (C153 default, or
# `--no-default-features --features lite` for C153-Lite).
# Do not inherit [lints] workspace = true (missing_docs / unsafe_code).

[features]
default = ["c153", "touch", "panel", "sleep", "radio", "orient"]
# PaperMono SKU C153 hardware: ST25R3916 NFC identity & Stamp LoRa-1262 discovery
c153 = ["dep:m5stack-papermono", "dep:embedded-hal-bus", "dep:embedded-hal", "dep:embedded-hal-async"]
# Compile-time pruned Lite-only profile (excludes C153 radio drivers, leaves radio pins unassigned).
lite = ["touch", "panel", "sleep", "radio", "orient"]
# System I2C: M5PM1 / M5IOE1 / FT6336G INT. Park IP2315. C153-Lite NFC NAK.
touch = []
# PDM audio: PDM GPIO45/46 + PYG12. Needs expander.
mic = ["touch"]
# Display: OTP 4-gray panel. Needs expander.
panel = ["touch", "dep:embassy-futures"]
# Interactive button sleep & wake: Button A hold 2 s to sleep, 1 s A/B hold to wake.
sleep = ["touch", "panel"]
# BMI270-driven page rotation (sticky-rs style). Opt-in until axis map is
# confirmed on glass. Needs touch I2C + panel. Survey/SoftAP cards redraw
# in page space; lamp gutter stays physical USB-down right edge.
orient = ["touch", "panel"]
# BLE pairing + Wi-Fi survey / SoftAP cards (+ optional wifi/ble counts).
# Landing default-on; survey and SoftAP stay idle until touch. No NVS.
# No foreign MAC/BSSID/IRK on CDC. SoftAP prints fixed demo SSID/pass only.
radio = [
  "dep:esp-alloc",
  "dep:esp-radio",
  "dep:embassy-futures",
  "dep:trouble-host",
  "dep:embassy-crypto",
  "dep:embassy-crypto-rustcrypto",
  "dep:rand_chacha",
  "dep:embassy-net",
  "dep:edge-dhcp",
  "dep:edge-nal",
  "dep:edge-nal-embassy",
  "dep:embedded-io-async",
  "esp-rtos/esp-radio",
  "esp-rtos/esp-alloc",
]

[dependencies]
esp-hal = { version = "1.2.2", features = [
  "esp32s3",
  "unstable",
] }
esp-println = { version = "0.18.0", default-features = false, features = [
  "esp32s3",
  "jtag-serial",
  "critical-section",
] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = [
  "esp32s3",
] }
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp32s3",
] }
esp-alloc = { version = "0.11.0", optional = true, features = [
  "esp32s3",
] }
# Published beta: stable esp-radio 0.18 targets the older esp-hal 1.1 family.
esp-radio = { version = "1.0.0-beta.1", optional = true, features = [
  "esp32s3",
  "unstable",
  "wifi",
  "ble",
  "coex",
] }

embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
embassy-futures = { version = "0.1.2", optional = true }
# Security uses Embassy's current driver API instead of the retired crypto chain.
trouble-host = { git = "https://github.com/embassy-rs/trouble", rev = "866ee711c14f9d4011ca7079c5c4af0f64a1f1bb", optional = true, default-features = false, features = [
  "default-packet-pool-mtu-255",
  "peripheral",
  "gatt",
  "security",
  "legacy-pairing",
  "derive",
  "central",
] }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c", optional = true, default-features = false }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c", optional = true, default-features = false, features = [
  "embassy-crypto-aes128-ecb",
  "embassy-crypto-aes128-cmac",
  "embassy-crypto-p256-ecdh",
] }
rand_chacha = { version = "0.10.0", optional = true, default-features = false }
embassy-net = { version = "0.9.1", optional = true, features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
edge-dhcp = { version = "0.8.0", optional = true }
edge-nal = { version = "0.7.0", optional = true }
edge-nal-embassy = { version = "0.9.0", optional = true }
embedded-io-async = { version = "0.7.0", optional = true }

m5stack-papermono-lite = { path = "../../crates/m5stack-papermono-lite" }
m5stack-papermono = { path = "../../crates/m5stack-papermono", optional = true }
papermono-log = { path = "../../crates/papermono-log" }
embedded-hal = { workspace = true, optional = true }
embedded-hal-async = { version = "1.0.0", optional = true }
embedded-hal-bus = { version = "0.3.0", optional = true, features = ["async"] }
embedded-graphics = "0.8.2"
static_cell = "2.1.1"

[build-dependencies]
sha2 = "0.11.1"

