[package]
name = "embassy-debug-fw"
version = "0.1.0"
edition = "2021"
publish = false
description = "PaperMono-Lite Embassy debug image. Flash only via cargo xtask flash-app after a matching snapshot exists."
license = "MIT"

# Workspace member, not a default-member: host `cargo test` skips this
# package. Build with `cargo xtask build-fw embassy-debug`.
# Do not inherit [lints] workspace = true (missing_docs / unsafe_code).

[features]
default = ["touch", "panel", "sleep", "radio"]
# System I2C: M5PM1 / M5IOE1 / FT6336G INT. Park IP2315. C153-Lite NFC NAK.
touch = []
# PDM audio: PDM GPIO45/46 + PYG12. Needs expander.
mic = ["touch"]
# Display: OTP 4-gray panel. Needs expander.
panel = ["touch"]
# Interactive button sleep & wake: Button A hold 2 s to sleep, 1 s A/B hold to wake.
sleep = ["touch", "panel"]
# BMI270-driven page rotation (sticky-rs style). Opt-in until axis map is
# confirmed on glass. Needs touch I2C + panel. Survey/SoftAP cards redraw
# in page space; lamp gutter stays physical USB-down right edge.
orient = ["touch", "panel"]
# BLE pairing + Wi-Fi survey / SoftAP cards (+ optional wifi/ble counts).
# Landing default-on; survey and SoftAP stay idle until touch. No NVS.
# No foreign MAC/BSSID/IRK on CDC. SoftAP prints fixed demo SSID/pass only.
radio = [
  "dep:esp-alloc",
  "dep:esp-radio",
  "dep:embassy-futures",
  "dep:trouble-host",
  "dep:bt-hci",
  "dep:embassy-net",
  "dep:edge-dhcp",
  "dep:edge-nal",
  "dep:edge-nal-embassy",
  "dep:embedded-io-async",
  "esp-rtos/esp-radio",
  "esp-rtos/esp-alloc",
]

[dependencies]
esp-hal = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "esp32s3",
  "unstable",
] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", default-features = false, features = [
  "esp32s3",
  "jtag-serial",
  "critical-section",
] }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "esp32s3",
] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "embassy",
  "esp32s3",
] }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", optional = true, features = [
  "esp32s3",
] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", optional = true, features = [
  "esp32s3",
  "unstable",
  "wifi",
  "ble",
  "coex",
] }

embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-sync = "0.8.0"
embassy-futures = { version = "0.1", optional = true }
trouble-host = { version = "0.7.0", optional = true, default-features = false, features = [
  "default-packet-pool-mtu-255",
  "peripheral",
  "gatt",
  "security",
  "legacy-pairing",
  "derive",
  "central",
] }
bt-hci = { version = "0.9.0", optional = true }
embassy-net = { version = "0.9.0", optional = true, features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
edge-dhcp = { version = "0.8.0", optional = true }
edge-nal = { version = "0.7.0", optional = true }
edge-nal-embassy = { version = "0.9.0", optional = true }
embedded-io-async = { version = "0.7", optional = true }

m5stack-papermono-lite = { path = "../../crates/m5stack-papermono-lite" }
papermono-log = { path = "../../crates/papermono-log" }
embedded-graphics = "0.8.2"
static_cell = "2.1.1"

[build-dependencies]
sha2 = "0.10.9"

