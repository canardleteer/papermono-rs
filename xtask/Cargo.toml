[package]
name = "xtask"
version = "0.1.0"
description = "PaperMono host CLI: USB inventory, snapshots, and host-only builds"
publish = false
edition.workspace = true
# Matches cargo-espflash / espflash 4.5. Workspace crates stay 1.85.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.5.41", features = ["derive", "env"] }
env_logger = "0.11.8"
image = { version = "0.25.9", default-features = false, features = ["png"] }
papermono-host = { path = "../host/papermono-host" }
resvg = { version = "0.48.1", default-features = false }
sha2 = "0.10.9"

[lints]
workspace = true
